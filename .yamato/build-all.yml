build-all:
  name: Build protobuf - all
  dependencies:
      - .yamato/build-linux-x64.yml
      - .yamato/build-macos-all.yml
      - .yamato/build-windows-all.yml#windows-c-libraries
      - .yamato/build-windows-all.yml#csharp-bindings

create-build-zip:
  name: Create Build Zip
  dependencies:
      - .yamato/build-all.yml#build-all

  agent:
    type: Unity::VM
    image: slough-ops/ubuntu-24.04-base:v0.0.4-1336798
    flavor: b1.medium

  artifacts:
    builds:
      paths:
        - builds.tar.zst

  commands:
    - curl -L -o bsdtar.zip https://public-stevedore.unity3d.com/r/public/bsdtar-linux-x64/3.8.9_3327cead_a63db9f0bd2c8c7dcfd35f5627eb47cab74075acdb50f5c7be2e524a9351126e.zip
    - unzip bsdtar.zip -d bsdtar
    - chmod +x bsdtar/bsdtar
    - mkdir -p builds/Google.Protobuf
    - mv csharp/src/Google.Protobuf/bin builds/Google.Protobuf/
    # builds.tar.zst unpacks faster than the old builds.zip
    - ./bsdtar/bsdtar --zstd --options zstd:compression-level=22 -cf builds.tar.zst -C builds bin Google.Protobuf include lib
